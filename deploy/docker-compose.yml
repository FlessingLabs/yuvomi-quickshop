# FlessingLabs QuickShop - Ergaenzung zu einer bestehenden Yuvomi-Installation.
#
# EIN Container neben Yuvomi, Yuvomi selbst bleibt unveraendert. Er speichert den
# Katalog (Volume quickshop-data) und ist zugleich der Eingang: alles ausserhalb
# von /api/extensions/flessinglabs-quickshop reicht er unveraendert an Yuvomi
# weiter. Yuvomi danach ueber http://<server>:8088 oeffnen.
#
# YUVOMI_URL: wie der Container Yuvomi erreicht. Im selben Compose-Netzwerk
# http://yuvomi:3000, sonst die Server-Adresse, z. B. http://192.168.1.10:3000.

services:
  quickshop:
    image: ghcr.io/flessinglabs/yuvomi-quickshop:latest
    # build: ../sidecar              # stattdessen lokal bauen
    container_name: quickshop
    restart: unless-stopped
    ports:
      - "0.0.0.0:${QUICKSHOP_HTTP_PORT:-8088}:8080"
    environment:
      - YUVOMI_URL=${YUVOMI_URL:-http://yuvomi:3000}
      - PUBLIC_ORIGIN=${QUICKSHOP_PUBLIC_ORIGIN:-}
    volumes:
      - quickshop-data:/data

volumes:
  quickshop-data:
