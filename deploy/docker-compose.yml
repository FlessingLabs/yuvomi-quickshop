# FlessingLabs QuickShop - Ergaenzung zu einer bestehenden Yuvomi-Installation.
#
# Startet zwei Container NEBEN Yuvomi und aendert Yuvomi selbst nicht:
#   quickshop  - der Katalogdienst (eigene SQLite-Datei im Volume quickshop-data)
#   proxy      - Caddy: ein Eingang fuer Yuvomi + QuickShop unter derselben Adresse
#
# Voraussetzung: Yuvomi laeuft per docker compose im Projekt "yuvomi" (Netzwerk
# "yuvomi_default", Container erreichbar als "yuvomi"). Abweichende Namen in
# .env ueber YUVOMI_NETWORK einstellen. Anleitung: README.md, Abschnitt Installation.

services:
  quickshop:
    build: ../sidecar
    image: flessinglabs/quickshop-sidecar:1.0.0
    container_name: quickshop
    restart: unless-stopped
    environment:
      - YUVOMI_URL=http://yuvomi:3000
      # Optional: feste oeffentliche Adresse(n), kommagetrennt, z. B.
      # http://192.168.1.10:8088. Leer = die Adresse, die der Browser aufgerufen hat.
      - PUBLIC_ORIGIN=${QUICKSHOP_PUBLIC_ORIGIN:-}
    volumes:
      - quickshop-data:/data
    networks: [yuvomi]

  proxy:
    image: caddy:2-alpine
    container_name: quickshop-proxy
    restart: unless-stopped
    ports:
      - "0.0.0.0:${QUICKSHOP_HTTP_PORT:-8088}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [quickshop]
    networks: [yuvomi]

volumes:
  quickshop-data:
  caddy-data:

networks:
  yuvomi:
    external: true
    name: ${YUVOMI_NETWORK:-yuvomi_default}
